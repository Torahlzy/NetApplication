// Top-level build file.
// 2026 现代化：AGP 9.3.2 + Gradle 9.6.0（腾讯镜像），AGP 内置 Kotlin 编译。
// 注：AGP 9.3.x 为本机 Android Studio 支持的最高版本（9.4.0 会提示不兼容）。
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.2'
        // Kotlin 无需在此声明：AGP 9.x 已内置 kotlin-android 能力
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // 兼容仍在使用的老 artifact（如 fragmentationx），阿里云 jcenter 镜像
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        maven { url 'https://jitpack.io' }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
