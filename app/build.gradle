apply plugin: 'com.android.application'

// ===== 本地私有配置（不提交 git）=====
// 站点默认域名等敏感/本机相关配置，放在仓库根目录的 local-app.properties
// （已被 .gitignore 忽略，不会提交）。若文件缺失则用空字符串兜底，
// 保证克隆/CI 环境也能正常编译；真实域名请参照 local-app.properties.example 填写。
def localAppProps = new Properties()
def localAppPropsFile = rootProject.file('local-app.properties')
if (localAppPropsFile.exists()) {
    localAppPropsFile.withInputStream { localAppProps.load(it) }
} else {
    println "提示：未找到本地配置文件 ${localAppPropsFile}，" +
            "DEFAULT_HOST_URL 将使用空默认值（可复制 local-app.properties.example 创建）"
}
def localDefaultHostUrl = localAppProps.getProperty('DEFAULT_HOST_URL', '')

android {
    namespace 'com.torahli.myapplication'
    compileSdk 37

    defaultConfig {
        applicationId "com.torahli.myapplication"
        minSdk 23
        targetSdk 37
        versionCode 1002
        versionName "2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // 站点默认域名：来自本地配置文件 local-app.properties（不提交 git），
        // AppConfig.DEFAULT_HOST_URL 改为引用该字段，仓库内不再硬编码真实域名
        buildConfigField "String", "DEFAULT_HOST_URL", '"' + localDefaultHostUrl + '"'
    }
    buildTypes {
        debug {
            buildConfigField "boolean", "_debug", "true"
        }
        release {
            buildConfigField "boolean", "_debug", "false"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // ===== AndroidX 基础 =====
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.annotation:annotation:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'

    // ===== 图片 =====
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

    // ===== 网络 / 解析 =====
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:3.0.0'
    implementation 'com.squareup.retrofit2:converter-scalars:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.franmontiel:PersistentCookieJar:v1.0.1'
    implementation 'com.facebook.stetho:stetho:1.6.0'
    implementation 'com.facebook.stetho:stetho-okhttp3:1.6.0'
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'com.google.code.gson:gson:2.14.0'

    // ===== RxJava =====
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    // ===== 导航（Fragmentation 的 AndroidX 移植版，包名不变）=====
    implementation 'me.yokeyword:fragmentationx-core:1.0.2'

    // ===== Kotlin =====
    // AGP 9.x 内置 Kotlin 编译器，会自动带上与之匹配的 kotlin-stdlib，
    // 请勿再显式锁版本（版本高于内置编译器会报元数据不兼容）。

    // ===== 注解 =====
    implementation 'org.jetbrains:annotations:26.1.0'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'

    // ===== 测试 =====
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit:2.2.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
